name: Price Tracker

on:
  schedule:
    - cron: "0 8 * * 1-5"
    - cron: "0 20 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test scraper
        run: pnpm test

      - name: Scrape prices
        run: pnpm scrape

      - name: Build
        run: pnpm build

      - name: Commit data changes
        id: commit
        run: |
          if git diff --quiet CHANGELOG.json data src/data; then
            echo "no data changes, skipping commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add CHANGELOG.json data src/data
            git commit -m "chore: update prices $(date -u +%Y-%m-%d)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure release for changelog days
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ensure-release.mjs --all

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: ocgo-pricing-dist
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Notify ai-10-usd comparison site
        if: needs.build.outputs.changed == 'true' && env.DISPATCH_TOKEN != ''
        env:
          DISPATCH_TOKEN: ${{ secrets.AI10USD_DISPATCH_TOKEN }}
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/reisi007/ai-10-usd/dispatches \
            -d '{"event_type":"source-updated","client_payload":{"source":"${{ github.repository }}","sha":"${{ github.sha }}"}}'
