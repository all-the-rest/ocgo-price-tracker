name: Price Tracker

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      fetchedAt: ${{ steps.stamp.outputs.fetchedAt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test scraper
        run: pnpm test

      - name: Scrape prices
        run: pnpm scrape

      - name: Build
        run: pnpm build

      - name: Read build stamp
        id: stamp
        run: echo "fetchedAt=$(node -e "console.log(require('./dist/data/latest.json').fetchedAt)")" >> "$GITHUB_OUTPUT"

      - name: Commit data changes
        id: commit
        run: |
          if git diff --quiet CHANGELOG.json data src/data; then
            echo "no data changes, skipping commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add CHANGELOG.json data src/data
            git commit -m "chore: update prices $(date -u +%Y-%m-%d)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure release for changelog days
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ensure-release.mjs --all

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: ocgo-pricing-dist
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Wait for Pages to serve new data
        if: needs.build.outputs.changed == 'true'
        env:
          EXPECTED: ${{ needs.build.outputs.fetchedAt }}
          SITE: https://ocgo-pricing.all-the.rest/data/latest.json
          MAX_TRIES: "90"
          SLEEP: "10"
        run: |
          for i in $(seq 1 "$MAX_TRIES"); do
            served=$(curl -fsS "${SITE}?wait=${RANDOM}" | jq -r '.fetchedAt // empty')
            if [ "$served" = "$EXPECTED" ]; then
              echo "New data is live (fetchedAt=$served) after $i attempt(s)"
              exit 0
            fi
            echo "Attempt $i/$MAX_TRIES: served fetchedAt='$served' (expected '$EXPECTED') — waiting for CDN propagation"
            sleep "$SLEEP"
          done
          echo "::error::Pages did not serve new data within $((MAX_TRIES * SLEEP / 60)) min — aborting dispatch to avoid stale comparison"
          exit 1

      - name: Notify ai-10-usd comparison site
        if: needs.build.outputs.changed == 'true' && env.DISPATCH_TOKEN != ''
        env:
          DISPATCH_TOKEN: ${{ secrets.AI10USD_DISPATCH_TOKEN }}
        run: |
          status=$(curl -sS -o /tmp/ai10usd-dispatch.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/reisi007/ai-10-usd/dispatches \
            -d '{"event_type":"source-updated","client_payload":{"source":"${{ github.repository }}","sha":"${{ github.sha }}"}}')
          echo "ai-10-usd dispatch returned HTTP $status"
          cat /tmp/ai10usd-dispatch.json
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Dispatch to ai-10-usd failed (HTTP $status) — AI10USD_DISPATCH_TOKEN lacks access to reisi007/ai-10-usd"
            exit 1
          fi
