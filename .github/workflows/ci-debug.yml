name: CI Debug

on:
  workflow_dispatch:

permissions: {}

jobs:
  repro:
    runs-on: ubuntu-latest
    steps:
      - name: Variant A - return as last statement
        id: va
        uses: actions/github-script@v9
        with:
          script: |
            const dependencyGroup = 'minor-and-patch';
            const safeGroup = dependencyGroup === 'minor-and-patch';
            const result = safeGroup && !dependencyGroup.includes('docker');
            return String(result);

      - name: Variant A gate
        if: steps.va.outputs.result == 'true'
        run: echo "VARIANT A PASSED"

      - name: Variant B - non-colliding output name after setOutput result
        id: vb
        uses: actions/github-script@v9
        with:
          script: |
            core.setOutput('result', 'true');
            core.setOutput('decision', 'true');

      - name: Variant B gate
        if: steps.vb.outputs.decision == 'true'
        run: echo "VARIANT B DECISION PASSED"

      - name: Variant B result probe
        run: echo "vb.result=[${{ steps.vb.outputs.result }}] va.result=[${{ steps.va.outputs.result }}]"
