name: Dependabot Auto-Merge

# Keine Branch Protection vorhanden -> der Workflow wartet selbst auf grüne
# CI-Checks (lewagon/wait-on-check-action), bevor er mergt.
# pull_request_target wird nur mit striktem Actor-Gate auf dependabot[bot]
# verwendet; es wird KEIN untrusted PR-Code ausgecheckt oder ausgeführt
# (nur Metadaten lesen + API-merge), daher im Repo vertretbar.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled]
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: read
  checks: read

concurrency:
  group: dependabot-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  automerge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Determine whether to merge
        id: should-merge
        uses: actions/github-script@v9
        with:
          script: |
            const updateType = '${{ steps.metadata.outputs.update-type }}';
            // output ist `dependency-group` (singular): ein PR hängt an maximal
            // EINER Dependabot-Gruppe (leer, wenn keine Gruppe aktiv ist)
            const dependencyGroup = '${{ steps.metadata.outputs.dependency-group }}';

            // Minor/Patch-Gruppen sind per Konstruktion sicher (dependabot.yml
            // matcht dort nur update-types minor+patch) - auch wenn die
            // Update-Type-Erkennung bei gruppierten PRs leer bleibt.
            const safeGroup = dependencyGroup === 'minor-and-patch';
            const safeIndividual = ['version-update:semver-minor', 'version-update:semver-patch'].includes(updateType);
            // Docker-Images haben keine zuverlässige semver-Klassifikation
            // und werden bewusst NIE auto-gemergt
            const notDocker = !dependencyGroup.includes('docker');

            // WICHTIG: `return` statt core.setOutput('result', ...) - github-script
            // reserviert den Output-Namen "result" für den Script-Rückgabewert und
            // überschreibt ein manuell gesetztes Output "result" sonst mit "".
            // (Bewiesen im Debug-Lauf 2026-08-25; ohne Fix werden die Merge-Schritte
            // still geskippt, obwohl der Run "success" meldet.)
            return (safeGroup || safeIndividual) && notDocker;

      # running-workflow-name verhindert, dass wait-on-check auf SICH SELBST
      # wartet (der AutomERGE-Run hängt am head-sha). allowed-conclusions
      # inkl. "skipped": sonst blockiert ein übersprungener Deploy-Job den Merge.
      # ACHTUNG: v1.9.1 kennt KEINEN "timeout"-Input (würde ignoriert -> potenziell
      # 6h-Hängen). Warte-Zeit nur über wait-interval (Sekunden zwischen Polls) +
      # das absichtlich kurze CI-Fenster im Repo begrenzt.
      - name: Wait for CI checks
        if: steps.should-merge.outputs.result == 'true'
        uses: lewagon/wait-on-check-action@v1.9.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          running-workflow-name: automerge
          wait-interval: 60
          allowed-conclusions: success,skipped

      # Parallele Dependabot-PRs können dieselben Zeilen in pnpm-lock.yaml
      # ändern (z. B. #25 vor #26) -> `gh pr merge` scheitert mit "merge
      # conflicts" und färbt die PR-CI rot. Ein "@dependabot rebase" scheitert
      # hier an der Ruleset-Regel "non_fast_forward" (ohne Bypass). Stattdessen
      # `gh pr update-branch` mit einem Merge-Commit (kein Force-Push, daher
      # ruleset-kompatibel) und direkter Merge in DIESEM Lauf: Ein GITHUB_TOKEN-
      # Push erzeugt keine regulären PR-Checks auf dem neuen Head, es wird also
      # nicht auf einen frischen Lauf gewartet. Der CI-Wait oben lief schon auf
      # dem alten Head, main wird als grün angenommen; der Merge-Commit vereint
      # nur diese beiden geprüften Stände. Bei echtem Inhaltskonflikt
      # (update-branch scheitert) wird still übersprungen statt den PR-Check
      # rot zu machen.
      - name: Reconcile PR branch with main
        id: branch
        if: steps.should-merge.outputs.result == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          refresh() {
            read -r mergeable state < <(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '[.mergeable, .mergeable_state] | @tsv' || echo "null unknown")
          }
          refresh
          for attempt in 1 2 3 4 5 6; do
            [ "$state" != "unknown" ] && [ -n "$state" ] && break
            sleep 5
            refresh
          done
          echo "mergeable=$mergeable state=$state"
          if [ "$state" = "dirty" ] || [ "$state" = "behind" ]; then
            if gh pr update-branch "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"; then
              # Mergeability wird von GitHub asynchron neu berechnet - erst
              # weiter, wenn der neue Head als mergebar bestätigt ist.
              for attempt in 1 2 3 4; do
                refresh
                if [ "$mergeable" = "true" ] && [ -n "$state" ] && [ "$state" != "unknown" ]; then break; fi
                sleep 3
              done
              echo "after update: mergeable=$mergeable state=$state"
              if [ "$mergeable" = "true" ] && [ -n "$state" ] && [ "$state" != "unknown" ]; then
                echo "::notice::PR branch updated with a merge commit - merging in this run."
                echo "current=true" >> "$GITHUB_OUTPUT"
              else
                echo "::warning::Merge status inconclusive after branch update - skipping merge without failing CI."
                echo "current=false" >> "$GITHUB_OUTPUT"
              fi
            else
              echo "::warning::PR branch could not be updated (content conflict) - skipping merge without failing CI."
              echo "current=false" >> "$GITHUB_OUTPUT"
            fi
          elif [ "$mergeable" = "true" ] && [ -n "$state" ] && [ "$state" != "unknown" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Merge status not conclusive - skipping merge without failing CI."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      # pull_request_target checkt per Default KEIN Repo aus -> "gh pr merge"
      # scheitert mit "not a git repository". Daher main auschecken (nur Metadaten/
      # API-Merge, KEIN PR-Code -> weiterhin sicher).
      - name: Checkout main (for gh pr merge)
        if: steps.should-merge.outputs.result == 'true' && steps.branch.outputs.current == 'true'
        uses: actions/checkout@v7
        with:
          ref: main
          sparse-checkout: .github

      - name: Merge Dependabot PR
        if: steps.should-merge.outputs.result == 'true' && steps.branch.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge "${{ github.event.pull_request.number }}" --squash --delete-branch
