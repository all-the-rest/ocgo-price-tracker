name: Dependabot Auto-Merge

# Keine Branch Protection vorhanden -> der Workflow wartet selbst auf grüne
# CI-Checks (lewagon/wait-on-check-action), bevor er mergt.
# pull_request_target wird nur mit striktem Actor-Gate auf dependabot[bot]
# verwendet; es wird KEIN untrusted PR-Code ausgecheckt oder ausgeführt
# (nur Metadaten lesen + API-merge), daher im Repo vertretbar.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled]
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: read
  checks: read

concurrency:
  group: dependabot-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  automerge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Determine whether to merge
        id: should-merge
        uses: actions/github-script@v9
        with:
          script: |
            const updateType = '${{ steps.metadata.outputs.update-type }}';
            // output ist `dependency-group` (singular): ein PR hängt an maximal
            // EINER Dependabot-Gruppe (leer, wenn keine Gruppe aktiv ist)
            const dependencyGroup = '${{ steps.metadata.outputs.dependency-group }}';

            // Minor/Patch-Gruppen sind per Konstruktion sicher (dependabot.yml
            // matcht dort nur update-types minor+patch) - auch wenn die
            // Update-Type-Erkennung bei gruppierten PRs leer bleibt.
            const safeGroup = dependencyGroup === 'minor-and-patch';
            const safeIndividual = ['version-update:semver-minor', 'version-update:semver-patch'].includes(updateType);
            // Docker-Images haben keine zuverlässige semver-Klassifikation
            // und werden bewusst NIE auto-gemergt
            const notDocker = !dependencyGroup.includes('docker');

            // WICHTIG: `return` statt core.setOutput('result', ...) - github-script
            // reserviert den Output-Namen "result" für den Script-Rückgabewert und
            // überschreibt ein manuell gesetztes Output "result" sonst mit "".
            // (Bewiesen im Debug-Lauf 2026-08-25; ohne Fix werden die Merge-Schritte
            // still geskippt, obwohl der Run "success" meldet.)
            return (safeGroup || safeIndividual) && notDocker;

      # running-workflow-name verhindert, dass wait-on-check auf SICH SELBST
      # wartet (der AutomERGE-Run hängt am head-sha). allowed-conclusions
      # inkl. "skipped": sonst blockiert ein übersprungener Deploy-Job den Merge.
      # ACHTUNG: v1.9.1 kennt KEINEN "timeout"-Input (würde ignoriert -> potenziell
      # 6h-Hängen). Warte-Zeit nur über wait-interval (Sekunden zwischen Polls) +
      # das absichtlich kurze CI-Fenster im Repo begrenzt.
      - name: Wait for CI checks
        if: steps.should-merge.outputs.result == 'true'
        uses: lewagon/wait-on-check-action@v1.9.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          running-workflow-name: automerge
          wait-interval: 60
          allowed-conclusions: success,skipped

      # pull_request_target checkt per Default KEIN Repo aus -> "gh pr merge"
      # scheitert mit "not a git repository". Daher main auschecken (nur Metadaten/
      # API-Merge, KEIN PR-Code -> weiterhin sicher).
      - name: Checkout main (for gh pr merge)
        if: steps.should-merge.outputs.result == 'true'
        uses: actions/checkout@v7
        with:
          ref: main
          sparse-checkout: .github

      - name: Merge Dependabot PR
        if: steps.should-merge.outputs.result == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge "${{ github.event.pull_request.number }}" --squash --delete-branch
